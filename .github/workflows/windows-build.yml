name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Boreas Setup
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0' }
          ./installer/Build.ps1 -Version $version -Revision $env:GITHUB_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: BoreasSetup
          path: installer/dist/BoreasSetup.exe
          if-no-files-found: error
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" installer/dist/BoreasSetup.exe --verify-tag --generate-notes --title "Boreas $env:GITHUB_REF_NAME"
